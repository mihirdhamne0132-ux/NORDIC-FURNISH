<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Nordic Furnish</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-card {
            border-radius: 12px;
            border: none;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg form-card p-4">

                <h3 class="text-center mb-4 fw-bold">Reset Password</h3>

                <form>

                    <div class="mb-3">
                        <label class="form-label">Enter Your Email</label>
                        <input type="email" class="form-control" placeholder="Enter registered email" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100">
                        Send Reset Link
                    </button>

                    <p class="text-center mt-3">
                        <a href="login.html" class="text-decoration-none">Back to Login</a>
                    </p>

                </form>

            </div>

        </div>
    </div>
</div>

</body>
</html>
