<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <!-- Responsive Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">NORDIC FURNISH</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <ul class="navbar-nav align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="../login.html">
                            <i class="bi bi-person-circle"></i> Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../products.html">
                            <i class="bi bi-bag"></i> Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="../contact.html">
                            <i class="bi bi-telephone"></i> Contact
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-dark ms-lg-3 mt-2 mt-lg-0" href="../cart.html">
                            <i class="bi bi-cart3"></i> Cart
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <div class="container py-5 px-3 px-md-0">

        <h2 class="text-center mb-5">Contact Us</h2>

        <div class="row justify-content-center">

            <!-- Contact Form -->
            <div class="col-12 col-lg-6 mb-5 mb-lg-0">
                <form class="shadow p-4 rounded bg-white">

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email id" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4" placeholder="Type your message here..."></textarea>
                    </div>

                    <button class="btn btn-dark w-100">Send Message</button>

                </form>
            </div>

            <!-- Contact Info -->
            <div class="col-12 col-lg-5 offset-lg-1 text-center text-lg-start">

                <h4 class="mb-4">Get in Touch</h4>

                <p>
                    <a href="tel:+917620846103" class="text-dark text-decoration-none fs-5">
                        <i class="bi bi-telephone-fill me-2"></i> +91 7620846103
                    </a>
                </p>

                <p>
                    <a href="mailto:info@nordicfurnish.com" class="text-dark text-decoration-none fs-5">
                        <i class="bi bi-envelope-fill me-2"></i> info@nordicfurnish.com
                    </a>
                </p>

                <div class="mt-4">

                    <a href="https://instagram.com/yourusername" target="_blank" class="text-dark fs-3 me-4">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="https://linkedin.com/in/yourusername" target="_blank" class="text-dark fs-3 me-4">
                        <i class="bi bi-linkedin"></i>
                    </a>

                    <a href="https://github.com/yourusername" target="_blank" class="text-dark fs-3">
                        <i class="bi bi-github"></i>
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
