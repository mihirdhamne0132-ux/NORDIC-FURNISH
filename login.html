<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Nordic Furnish</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-card {
            border: none;
            border-radius: 12px;
        }

        .login-card .form-control {
            border-radius: 8px;
        }

        .login-card .btn {
            border-radius: 8px;
        }

        .login-image {
            background: url("images/hero.jpg") center/cover no-repeat;
            min-height: 100%;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        @media (max-width: 768px) {
            .login-image {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Responsive Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">NORDIC FURNISH</a>

            <!-- Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <ul class="navbar-nav align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="login.html">
                            <i class="bi bi-person-circle"></i> Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="products.html">
                            <i class="bi bi-bag"></i> Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            <i class="bi bi-telephone"></i> Contact
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-dark ms-lg-3 mt-2 mt-lg-0" href="cart.html">
                            <i class="bi bi-cart3"></i> Cart
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">

            <div class="col-lg-8">
                <div class="card login-card shadow-lg">

                    <div class="row g-0">

                        <!-- Left Image -->
                        <div class="col-md-6 login-image d-none d-md-block">
                        </div>

                        <!-- Login Form -->
                        <div class="col-md-6 p-5">

                            <h3 class="mb-4 text-center fw-bold">Login</h3>

                            <form>

                                <div class="mb-3">
                                    <label class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-envelope"></i>
                                        </span>
                                        <input type="email" class="form-control" placeholder="Enter email" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-lock"></i>
                                        </span>
                                        <input type="password" class="form-control" placeholder="Enter password"
                                            required>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between mb-3">
                                    <div>
                                        <input type="checkbox"> Remember me
                                    </div>
                                    <a href="forgot-password.html" class="text-decoration-none">Forgot password?</a>
                                </div>

                                <button type="submit" class="btn btn-dark w-100 mb-3">
                                    Login
                                </button>

                                <p class="text-center">
                                    Don't have an account?
                                    <a href="register.html" class="text-decoration-none">Register</a>
                                </p>

                            </form>

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
